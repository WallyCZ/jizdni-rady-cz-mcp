# Každé úterý posune submodul upstream (tangero/jizdni-rady-czech-republic)
# na nejnovější commit jeho main. Když se změnil, commitne to a spustí
# sestavení image (push z GITHUB_TOKEN jiné workflow nespouští,
# workflow_dispatch ano).

name: Aktualizace upstream

on:
  schedule:
    - cron: '0 6 * * 2'  # úterý 06:00 UTC, den po aktualizaci dat v upstreamu
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Posun submodulu
        id: bump
        run: |
          git submodule update --remote upstream
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rev=$(git -C upstream log -1 --format='%h %s')
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "chore: upstream -> $rev"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Spuštění sestavení image
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docker.yml --ref "${{ github.ref_name }}"
