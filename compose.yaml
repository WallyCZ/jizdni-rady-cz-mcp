# Image sestavuje GitHub Actions (.github/workflows/docker.yml) a publikuje
# na ghcr.io (veřejný balíček, přihlášení není potřeba).
# Lokálně sestavený image: docker build -t ghcr.io/wallycz/jizdni-rady-cz-mcp:latest .
#
# GOLEMIO_API_KEY (zdarma na api.golemio.cz) přidá k pražským spojům aktuální
# zpoždění; bez něj server odpovídá jen podle jízdního řádu. Zadejte ho do .env
# vedle tohoto souboru nebo do proměnných stacku v Portaineru, ne sem.

x-image: &image
  image: ghcr.io/wallycz/jizdni-rady-cz-mcp:${IMAGE_TAG:-latest}
  pull_policy: missing
  environment:
    GOLEMIO_API_KEY: ${GOLEMIO_API_KEY:-}

services:
  mcp:
    <<: *image
    profiles: ["stdio"]
    stdin_open: true
    init: true
    read_only: true
    tmpfs:
      - /tmp

  hass-mcp:
    <<: *image
    # --pass-environment: mcp-proxy otherwise starts the server with an empty
    # environment, without GOLEMIO_API_KEY.
    command: ["mcp-proxy", "--pass-environment", "--host", "0.0.0.0", "--port", "8000", "jizdni-rady-cz-mcp"]
    ports:
      - "${MCP_PORT:-8000}:8000"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
