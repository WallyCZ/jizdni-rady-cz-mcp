# Image sestavuje GitHub Actions (.github/workflows/docker.yml) a publikuje
# na ghcr.io. Balíček je soukromý, proto nejdřív:
#   docker login ghcr.io -u <github-uživatel>   (heslo: PAT s read:packages)
# Lokálně sestavený image: docker build -t ghcr.io/wallycz/jizdni-rady-cz:latest .

x-image: &image
  image: ghcr.io/wallycz/jizdni-rady-cz:${IMAGE_TAG:-latest}
  pull_policy: missing

services:
  mcp:
    <<: *image
    profiles: ["stdio"]
    stdin_open: true
    init: true
    read_only: true
    tmpfs:
      - /tmp

  hass-mcp:
    <<: *image
    command: ["mcp-proxy", "--host", "0.0.0.0", "--port", "8000", "jizdni-rady-cz-mcp"]
    ports:
      - "${MCP_PORT:-8000}:8000"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
